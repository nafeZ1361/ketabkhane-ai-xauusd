name: Guardian F5 Independent Inspector

on:
  workflow_dispatch:
  push:
    branches:
      - work/guardian-phase5-f5-kill-switch-20261127
    paths:
      - "AGENTS.md"
      - "ایجانت/xauusd-guardian/**"
      - ".github/guardian-inspector/**"
      - ".github/workflows/guardian-f5-independent-inspector.yml"

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    name: Freeze exact F5 source
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      archive_sha256: ${{ steps.freeze.outputs.archive_sha256 }}
      target_commit: ${{ steps.freeze.outputs.target_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: freeze
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "guardian-f5-source.zip"
          $staging = Join-Path $env:RUNNER_TEMP "guardian-f5-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path "ایجانت\xauusd-guardian\*" -Destination $staging -Recurse -Force
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) { throw "source archive creation failed" }
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "archive_sha256=$digest" >> $env:GITHUB_OUTPUT
          "target_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-f5-frozen-source
          path: ${{ runner.temp }}/guardian-f5-source.zip
          if-no-files-found: error
          retention-days: 7

  inspect:
    name: Independent F5 inspection
    needs: freeze
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guardian-f5-frozen-source
          path: ${{ runner.temp }}/guardian-f5-artifact
      - name: Checkout pinned independent F5 harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nafeZ1361/ketabkhane-ai-xauusd
          ref: 2caf135cfac4e8f800b90a41deda463e576c7581
          path: .guardian-inspector
          persist-credentials: false
          fetch-depth: 1
      - name: Extract frozen snapshot
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "guardian-f5-artifact\guardian-f5-source.zip"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne "${{ needs.freeze.outputs.archive_sha256 }}") { throw "archive digest mismatch" }
          $root = Join-Path $env:RUNNER_TEMP "guardian-f5-frozen"
          $evidence = Join-Path $env:RUNNER_TEMP "guardian-f5-evidence"
          $work = Join-Path $env:RUNNER_TEMP "guardian-f5-work"
          New-Item -ItemType Directory -Path $root,$evidence -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $project = $root
          if (-not (Test-Path (Join-Path $project "src\guardian\firewall\kill_switch.py"))) { throw "F5 snapshot not found after extraction" }
          Copy-Item (Join-Path $project "*") $work -Recurse -Force
          "FROZEN_ROOT=$($project.FullName)" >> $env:GITHUB_ENV
          "INSPECTOR_WORK=$work" >> $env:GITHUB_ENV
          "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          "EVIDENCE_ROOT=$evidence" >> $env:GITHUB_ENV
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.8"
          architecture: x64
      - name: Create isolated environment
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:INSPECTOR_WORK ".venv")
          if ($LASTEXITCODE -ne 0) { throw "venv failed" }
          Push-Location $env:INSPECTOR_WORK
          try {
            python -m pip install --disable-pip-version-check --require-hashes -r requirements-hashed.lock
            if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
            python -m pip check
            if ($LASTEXITCODE -ne 0) { throw "pip check failed" }
          } finally { Pop-Location }
      - name: Create independent Inspector identity
        shell: pwsh
        run: |
          $account = "GuardianF5Inspector"
          if (Get-LocalUser -Name $account -ErrorAction SilentlyContinue) { throw "Inspector account already exists" }
          $bytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA1!"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $account -Password $secure -PasswordNeverExpires -UserMayNotChangePassword -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $account
          $sid = (Get-LocalUser -Name $account).SID.Value
          $runnerSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if (@(Get-LocalGroupMember -Group Administrators | ForEach-Object { $_.SID.Value }) -contains $sid) { throw "Inspector is admin" }
          "INSPECTOR_ACCOUNT=$account" >> $env:GITHUB_ENV
          "INSPECTOR_PASSWORD=$password" >> $env:GITHUB_ENV
          "INSPECTOR_SID=$sid" >> $env:GITHUB_ENV
          "INSPECTOR_RUNNER_SID=$runnerSid" >> $env:GITHUB_ENV
          Write-Output "::add-mask::$password"
      - name: Run independent F5 harness
        id: inspector
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE ".guardian-inspector\.github\guardian-inspector\run_as_inspector.ps1"
          $python = (Get-Command python).Source
          $harness = Join-Path $env:GITHUB_WORKSPACE ".guardian-inspector\.github\guardian-inspector\f5_inspector.py"
          $out = Join-Path $env:RUNNER_TEMP "f5-inspector-result.json"
          & $helper -Python $python -WorkingDirectory $env:INSPECTOR_WORK -EvidenceRoot $env:EVIDENCE_ROOT -LogName "f5-inspector.log" -TargetCommit $env:GITHUB_SHA -Arguments @($harness,"--project-root",$env:INSPECTOR_WORK,"--frozen-root",$env:FROZEN_ROOT,"--archive",$env:ARCHIVE_PATH,"--output",$out)
          if ($LASTEXITCODE -ne 0) { throw "Independent F5 inspection BLOCK" }
          Copy-Item $out (Join-Path $env:EVIDENCE_ROOT "f5-inspector-result.json") -Force
      - name: Verify independence and verdict
        shell: pwsh
        run: |
          if ($env:INSPECTOR_SID -eq $env:INSPECTOR_RUNNER_SID) { throw "Inspector identity is not distinct" }
          $harnessHead = (git -C (Join-Path $env:GITHUB_WORKSPACE ".guardian-inspector") rev-parse HEAD).Trim()
          if ($harnessHead -ne "2caf135cfac4e8f800b90a41deda463e576c7581") { throw "Harness pin mismatch" }
          $summary = Get-Content (Join-Path $env:EVIDENCE_ROOT "f5-inspector-result.json") -Raw | ConvertFrom-Json
          if ($summary.verdict -ne "PASS") { throw "F5 Inspector verdict is not PASS" }
          Write-Host "F5 independent inspection PASS"
      - name: Upload F5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-f5-inspector-evidence
          path: ${{ runner.temp }}/guardian-f5-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove Inspector identity
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name "GuardianF5Inspector" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "GuardianF5Inspector"
          }
