[project]
name = "xauusd-guardian"
version = "0.1.0"
description = "DEMO-only XAUUSD research and execution system"
requires-python = ">=3.11,<3.12"

# Runtime dependencies are intentionally minimal (D-004).
# Installed from requirements.lock, not from here.
dependencies = [
    "MetaTrader5==5.0.6231",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:guardian.*"]
