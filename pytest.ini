[pytest]
# Keep the settings that were declared in pyproject.toml [tool.pytest.ini_options]:
# once this file exists, pytest reads config from here and ignores pyproject.
pythonpath = src
testpaths = tests
addopts = -q -p no:libtmux
# The libtmux pytest plugin (bundled with some dev environments) applies marks to
# fixtures, which is a hard error under pytest>=9 and crashes collection of the
# entire suite. The project does not use libtmux anywhere (verified: no references
# in tests/ or src/).
