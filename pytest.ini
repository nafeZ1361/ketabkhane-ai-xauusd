[pytest]
# pytest.ini takes precedence over pyproject [tool.pytest.ini_options],
# so all settings must live here together.
pythonpath = src
testpaths = tests
# The bundled libtmux plugin ships pytest marks on fixtures, which pytest>=9
# rejects at collection time. This project does not use libtmux; disable its
# autoload so the suite can be collected deterministically.
addopts = -q -p no:libtmux
